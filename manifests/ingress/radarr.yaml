apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: radarr-tls
  namespace: media
spec:
  secretName: radarr-tls
  issuerRef:
    name: selfsigned
    kind: ClusterIssuer
  dnsNames:
    - radarr.home
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: radarr-headers
  namespace: media
spec:
  headers:
    customRequestHeaders:
      X-Forwarded-Proto: "https"
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: radarr
  namespace: media
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - match: Host(`radarr.home`)
      kind: Rule
      services:
        - name: radarr
          port: 7878
      middlewares:
        - name: radarr-headers
  tls:
    secretName: radarr-tls